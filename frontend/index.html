<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>志愿者积分与信用评估</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7f9; color: #18202a; }
      main { max-width: 920px; margin: 0 auto; padding: 48px 24px; }
      h1 { margin: 0 0 12px; font-size: 32px; }
      p { line-height: 1.7; }
      .panel { margin-top: 24px; padding: 20px; border: 1px solid #d9dee7; border-radius: 8px; background: #fff; }
      .status { font-weight: 700; color: #116b45; }
      pre { overflow: auto; padding: 16px; background: #101820; color: #e7edf5; border-radius: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>志愿者积分与信用评估</h1>
      <p>记录志愿服务、计算积分信用、处理投诉和生成排行榜的后端服务。</p>
      <section class="panel">
        <p>后端状态：<span id="status" class="status">检测中</span></p>
        <pre id="output">{}</pre>
      </section>
    </main>
    <script>
      async function probe(url, label) {
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        try {
          const res = await fetch(url);
          const data = await res.json();
          status.textContent = label + '正常';
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          status.textContent = label + '异常';
          status.style.color = '#a43f2b';
          output.textContent = String(error);
        }
      }
      probe('/api/health', '健康检查');
      probe('/api/v1/service-types', '服务类型接口');
    </script>
  </body>
</html>
